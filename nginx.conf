server {
    listen 80;
    listen [::]:80;
    server_name test.samdpi.uz;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        root /home/ali/test;
    }

    location /media/ {
        root /home/ali/test;
    }

    location / {
       include proxy_params;
       proxy_pass http://unix:/run/test.sock;
    }
}
